# Physical pixels. Reload: Ctrl+Alt+Shift+R. Unknown keys are errors.
gap=24
width_percent=97
poll_ms=250
reserve_top=0
# Match the detected Noctalia bar. One window follows its width automatically.
align_to_bar=true
bar_class=Qt683QWindowToolSaveBits
# Request the subtle native Windows 11 corner radius.
round_corners=true
# 7 = Ctrl+Alt+Shift; 3 = Ctrl+Alt. Restart required for this setting.
hotkey_modifiers=7
# 8 = Win: Left/Right switches groups; Win+Q closes the active managed window. Restart required.
navigation_modifiers=8
# Semicolon-separated exact window classes; shell classes are always excluded.
exclude_classes=RainmeterMeterWindow;NoctaliaShell;OperationStatusWindow


# Builds noctalia.exe on GitHub's Windows machines, so you don't need Qt or Visual Studio
# installed. Push the project to a GitHub repo, open the "Actions" tab, and download the
# "noctalia-win" artifact from the latest run: a ready-to-run folder.
name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface compiler errors as annotations (readable without downloading the logs).
            Select-String -Path build.log -Pattern ': (fatal )?error' | Select-Object -First 40 |
              ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/noctalia.exe dist/
          windeployqt --release --qmldir qml --no-translations --no-system-d3d-compiler --no-opengl-sw dist/noctalia.exe

      - uses: actions/upload-artifact@v4
        with:
          name: noctalia-win
          path: dist
